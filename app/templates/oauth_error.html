<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SoundAccess — Error de autorización</title>
  <style>
    body { margin:0; font-family:"Segoe UI", system-ui, sans-serif; background:#f4f5f7; color:#1f2430; }
    .card { max-width:430px; margin:10vh auto; background:#fff; border:1px solid #e3e6ea;
            border-radius:12px; padding:26px; }
    h1 { font-size:1.05rem; margin:0 0 8px; }
    p { font-size:.9rem; color:#6b7280; }
    code { background:#f1f2f4; padding:2px 5px; border-radius:5px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Solicitud de autorización inválida</h1>
    <p>{{ message }}</p>
    <p>Por seguridad no se redirigió a la aplicación solicitante.</p>
  </div>
</body>
</html>
